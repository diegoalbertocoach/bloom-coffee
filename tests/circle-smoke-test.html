<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bloom Circle — Testes automatizados</title>
<style>
  body{ font-family: -apple-system, sans-serif; max-width:720px; margin:40px auto; padding:0 20px; color:#1D1E19; }
  h1{ font-size:20px; margin-bottom:4px; }
  p.sub{ color:#666; font-size:13px; margin-bottom:24px; }
  .result{ padding:10px 14px; border-radius:8px; margin-bottom:8px; font-size:13.5px; font-family:ui-monospace,monospace; white-space:pre-wrap; }
  .pass{ background:#E7F3E9; color:#1E5B2F; }
  .fail{ background:#FCE8E4; color:#8A2E1B; }
  .summary{ margin-top:20px; padding:14px; border-radius:8px; font-weight:600; }
  .summary.all-pass{ background:#1E5B2F; color:#fff; }
  .summary.has-fail{ background:#8A2E1B; color:#fff; }
</style>
</head>
<body>
<h1>Bloom Circle — Testes automatizados</h1>
<p class="sub">Executa contra assets/circle-data.js e assets/circle.js reais (BloomCircleLogic / BloomCirclePrefs), sem mocks.</p>
<div id="results"></div>
<div id="summary"></div>

<script src="../assets/circle-data.js"></script>
<script src="../assets/circle.js"></script>
<script>
(function () {
  const results = [];
  function assertEqual(actual, expected, label) {
    const pass = JSON.stringify(actual) === JSON.stringify(expected);
    results.push({ pass, label, actual, expected });
  }
  function assertTrue(value, label) {
    results.push({ pass: !!value, label, actual: value, expected: true });
  }

  const L = BloomCircleLogic;

  // ---------- 1. Carregamento dos dados ----------
  assertEqual(BLOOM_CIRCLE_DEMO.mode, "demo", "BLOOM_CIRCLE_DEMO.mode é 'demo'");
  assertEqual(L.getLevels().length, 5, "getLevels: existem 5 níveis");
  assertTrue(Object.isFrozen(BLOOM_CIRCLE_DEMO), "BLOOM_CIRCLE_DEMO está congelado (Object.freeze)");

  // ---------- 2. Nível inicial ----------
  assertEqual(BLOOM_CIRCLE_DEMO.user.levelId, "semente", "Nível inicial do usuário demo é 'semente'");
  assertEqual(BLOOM_CIRCLE_DEMO.user.visits, 1, "Visitas demonstrativas iniciais = 1");

  // ---------- 3. Alternância de níveis (ordem e navegação) ----------
  assertEqual(L.getLevelById("semente").order, 1, "Semente é o nível 1");
  assertEqual(L.getLevelById("embaixador").order, 5, "Embaixador Bloom é o nível 5");
  assertEqual(L.getNextLevel("semente").id, "broto", "getNextLevel(semente) = broto");
  assertEqual(L.getNextLevel("bloom").id, "embaixador", "getNextLevel(bloom) = embaixador");
  assertEqual(L.getNextLevel("embaixador"), null, "getNextLevel(embaixador) = null (nível máximo)");
  assertEqual(L.getPreviousLevel("jardim").id, "broto", "getPreviousLevel(jardim) = broto");

  assertTrue(L.isLevelReached("semente", "jardim"), "isLevelReached: semente já foi alcançado quando o nível atual é jardim");
  assertTrue(!L.isLevelReached("bloom", "jardim"), "isLevelReached: bloom NÃO foi alcançado quando o nível atual é jardim");
  assertTrue(L.isLevelReached("jardim", "jardim"), "isLevelReached: o próprio nível atual conta como alcançado");

  // ---------- 4. Progresso ----------
  const progressSemente = L.computeProgress(1, "semente");
  assertEqual(progressSemente.label, "1 de 4 visitas demonstrativas", "computeProgress: Semente com 1 visita → '1 de 4 visitas demonstrativas'");
  assertTrue(progressSemente.hasNext, "computeProgress: Semente tem próximo nível");

  const progressEmbaixador = L.computeProgress(35, "embaixador");
  assertTrue(!progressEmbaixador.hasNext, "computeProgress: Embaixador Bloom não tem próximo nível (topo da jornada)");
  assertEqual(progressEmbaixador.label, "Nível máximo da jornada demonstrativa.", "computeProgress: mensagem correta no nível máximo");

  // ---------- 5. Visitas demonstrativas coerentes por nível (usadas pelo painel de apresentação) ----------
  assertEqual(L.demoVisitsForLevel("semente"), 1, "demoVisitsForLevel(semente) = 1 (visita real do usuário demo)");
  assertEqual(L.demoVisitsForLevel("jardim"), L.getLevelById("jardim").threshold, "demoVisitsForLevel(jardim) = limiar do próprio nível");

  // ---------- 6. Badges sazonais ----------
  assertEqual(BLOOM_CIRCLE_DEMO.seasonalCollection.length, 4, "Existem 4 selos de estação");
  const verao = BLOOM_CIRCLE_DEMO.seasonalCollection.find((s) => s.id === "verao");
  assertTrue(verao.unlocked === true, "Verão está desbloqueado na demonstração");
  const outrasEstacoes = BLOOM_CIRCLE_DEMO.seasonalCollection.filter((s) => s.id !== "verao");
  assertTrue(outrasEstacoes.every((s) => s.unlocked === false), "As demais 3 estações estão bloqueadas na demonstração");

  // ---------- 7. Histórico sem dados sensíveis ----------
  const historyText = BLOOM_CIRCLE_DEMO.history.map((h) => h.label).join(" ");
  assertTrue(!/R\$|\d{2}\/\d{2}\/\d{4}/.test(historyText), "Histórico não contém valores em R$ nem datas específicas (dd/mm/aaaa)");

  // ---------- 8. Onboarding — preferências, não dados pessoais ----------
  localStorage.removeItem(BloomCirclePrefs.ONBOARDING_KEY);
  localStorage.removeItem(BloomCirclePrefs.DEMO_LEVEL_KEY);
  assertTrue(!BloomCirclePrefs.hasSeenOnboarding(), "hasSeenOnboarding: false antes de qualquer interação");
  BloomCirclePrefs.setOnboardingSeen();
  assertTrue(BloomCirclePrefs.hasSeenOnboarding(), "hasSeenOnboarding: true depois de setOnboardingSeen()");

  // ---------- 9. Persistência apenas de preferências demonstrativas ----------
  BloomCirclePrefs.saveDemoLevel("bloom");
  assertEqual(BloomCirclePrefs.getSavedDemoLevel(), "bloom", "saveDemoLevel/getSavedDemoLevel: nível salvo corretamente");

  // ---------- 10. Ausência de dados pessoais no localStorage ----------
  const storageKeys = Object.keys(localStorage);
  const onlyExpectedKeys = storageKeys.every(
    (k) => k === BloomCirclePrefs.ONBOARDING_KEY || k === BloomCirclePrefs.DEMO_LEVEL_KEY || k === "bloom.cart.v1"
  );
  assertTrue(onlyExpectedKeys, "localStorage: nenhuma chave além das preferências de demo (e do carrinho, de outra feature) existe");
  const storageValues = storageKeys.map((k) => localStorage.getItem(k)).join(" ").toLowerCase();
  assertTrue(!storageValues.includes("diego"), "localStorage: valores salvos não contêm nome de usuário");

  // limpa o que este teste criou
  localStorage.removeItem(BloomCirclePrefs.ONBOARDING_KEY);
  localStorage.removeItem(BloomCirclePrefs.DEMO_LEVEL_KEY);

  // ---------- 11. Redução de movimento — verificação estrutural ----------
  assertTrue(typeof window.matchMedia === "function", "window.matchMedia disponível (usado para respeitar prefers-reduced-motion via CSS global)");

  // ---------- Renderização dos resultados ----------
  const resultsEl = document.getElementById("results");
  let failCount = 0;
  results.forEach((r) => {
    const div = document.createElement("div");
    div.className = "result " + (r.pass ? "pass" : "fail");
    div.textContent = (r.pass ? "PASS — " : "FAIL — ") + r.label +
      (r.pass ? "" : ` (esperado: ${JSON.stringify(r.expected)}, obtido: ${JSON.stringify(r.actual)})`);
    resultsEl.appendChild(div);
    if (!r.pass) failCount += 1;
  });

  const summaryEl = document.getElementById("summary");
  summaryEl.className = "summary " + (failCount === 0 ? "all-pass" : "has-fail");
  summaryEl.textContent = failCount === 0
    ? `Todos os ${results.length} testes passaram.`
    : `${failCount} de ${results.length} testes falharam.`;

  console.log(`Bloom Circle tests: ${results.length - failCount}/${results.length} passed.`);
})();
</script>
</body>
</html>
